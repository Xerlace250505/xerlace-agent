appId: ai.xerlace.agent
productName: Xerlace Agent
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
asar: true
mac:
  category: public.app-category.developer-tools
  icon: electron/icons/icon.icns
  hardenedRuntime: true
  artifactName: Xerlace-Agent-${version}-mac.${ext}
  target:
    - dmg
    - zip
win:
  icon: electron/icons/icon.ico
  artifactName: Xerlace-Agent-Setup-${version}.${ext}
  target:
    - nsis
linux:
  category: Development
  icon: electron/icons/icon.png
  artifactName: Xerlace-Agent-${version}-linux-amd64.${ext}
  target:
    - deb
